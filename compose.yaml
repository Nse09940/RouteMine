services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routemine
      POSTGRES_USER: routemine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemine -d routemine"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - routemine-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/routemine
      DB_USER: routemine
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_DISPATCHER_USERNAME: ${BOOTSTRAP_DISPATCHER_USERNAME:-dispatcher}
      BOOTSTRAP_DISPATCHER_PASSWORD: ${BOOTSTRAP_DISPATCHER_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  routemine-postgres:

