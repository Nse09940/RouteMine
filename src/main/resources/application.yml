spring:
  application:
    name: routemine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routemine}
    username: ${DB_USER:routemine}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

routemine:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: ${JWT_TTL:PT8H}
  bootstrap:
    dispatcher-username: ${BOOTSTRAP_DISPATCHER_USERNAME:dispatcher}
    dispatcher-password: ${BOOTSTRAP_DISPATCHER_PASSWORD}

logging:
  level:
    com.routemine: INFO
